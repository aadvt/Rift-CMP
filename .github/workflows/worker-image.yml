# Builds the scan worker and pushes it to Azure Container Registry.
#
# The build lives here rather than on a laptop because the worker image is the
# one artefact that must be built for Linux: it carries a Chromium and a Prisma
# query engine, and both are platform-specific. An image built on a developer's
# Windows machine would push successfully and then fail on the first scan.
#
# It is also here because there was nowhere else. ACR Tasks — the obvious remote
# builder — is disabled on new subscriptions, and GitHub already has the source.
name: Images

on:
  push:
    branches: [main]
    # Only when something the image actually contains has changed. A docs commit
    # should not spend five minutes rebuilding Chromium.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # One job per image, sharing the same layer cache. The API and the worker
    # are the same workspace up to the final stage, so building them together
    # costs little more than building either alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: worker
            image: rift-worker
          - target: api
            image: rift-api
          - target: dashboard
            image: rift-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          # Two tags: `latest` for the deployment to follow, and the commit sha
          # so a running container can always be traced back to the source it
          # was built from.
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
